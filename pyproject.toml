[build-system]
# numpy is a runtime dependency only; the C extension does not need it to build.
# Requiring it here forces manylinux to compile numpy from source under old GCC.
requires = [
  "meson-python>=0.15",
  "meson>=1.2",
  "ninja",
]
build-backend = "mesonpy"

[project]
name = "gauss-jacobi-quad"
version = "0.2.2"
description = "CPython extension for GaussJacobiQuad (ISO_C_BINDING C ABI, Stable ABI / abi3)"
readme = "python/README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
]
keywords = ["quadrature", "gauss-jacobi", "numerical", "fortran", "abi3", "stable-abi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.20",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/HaoZeke/GaussJacobiQuad"
Repository = "https://github.com/HaoZeke/GaussJacobiQuad"
Documentation = "https://github.com/HaoZeke/GaussJacobiQuad/tree/main/docs/orgmode"
"Bug Tracker" = "https://github.com/HaoZeke/GaussJacobiQuad/issues"

[project.scripts]
gauss-jacobi-quad = "gauss_jacobi_quad.cli:main"

[tool.meson-python]
# Required for the wheel to be tagged abi3 (Stable ABI). The extension is also
# built with meson limited_api: '3.9' / Py_LIMITED_API 0x03090000.
limited-api = true

[tool.meson-python.args]
# Root meson.build: only the CPython extension is installed into the wheel
setup = ["-Dpython_package=true", "-Dwarning_level=1", "-Dbuildtype=release"]

[tool.cibuildwheel]
# Stable ABI (Limited API 3.9): build once against CPython 3.9 → cp39-abi3 wheel
# usable on 3.9, 3.10, 3.11, 3.12, 3.13, … (GIL builds). No per-version matrix.
build = "cp39-*"
skip = "*-win* *-macos* pp* *musllinux*"
archs = ["auto64"]
build-frontend = "build"
test-requires = ["pytest", "numpy"]
# Exercise the abi3 wheel on a newer interpreter in the same job when available
test-command = "pytest {project}/python/tests -q"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran openblas-devel || dnf install -y gcc-gfortran openblas-devel || (apt-get update && apt-get install -y gfortran libopenblas-dev)"
environment = { PKG_CONFIG_PATH = "/usr/lib64/pkgconfig:/usr/lib/pkgconfig" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
