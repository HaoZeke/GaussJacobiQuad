[build-system]
# numpy is a runtime dependency only; the C extension does not need it to build.
# Requiring it here forces manylinux to compile numpy from source under old GCC.
requires = [
  "meson-python>=0.15",
  "meson>=1.2",
  "ninja",
]
build-backend = "mesonpy"

[project]
name = "gauss-jacobi-quad"
version = "0.2.1"
description = "CPython extension for GaussJacobiQuad (ISO_C_BINDING C ABI, free-threading ready)"
readme = "python/README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
]
keywords = ["quadrature", "gauss-jacobi", "numerical", "fortran", "free-threading"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.20",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/HaoZeke/GaussJacobiQuad"
Repository = "https://github.com/HaoZeke/GaussJacobiQuad"
Documentation = "https://github.com/HaoZeke/GaussJacobiQuad/tree/main/docs/orgmode"
"Bug Tracker" = "https://github.com/HaoZeke/GaussJacobiQuad/issues"

[project.scripts]
gauss-jacobi-quad = "gauss_jacobi_quad.cli:main"

[tool.meson-python.args]
# Root meson.build: only the CPython extension is installed into the wheel
setup = ["-Dpython_package=true", "-Dwarning_level=1", "-Dbuildtype=release"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp313t-*"
skip = "*-win* *-macos* pp* *musllinux*"
enable = ["cpython-freethreading"]
archs = ["auto64"]
build-frontend = "build"
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/python/tests -q"
# manylinux2014 ships GCC 10.2; 2_28 has a newer toolchain for Fortran/C mixed builds
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran openblas-devel || dnf install -y gcc-gfortran openblas-devel || (apt-get update && apt-get install -y gfortran libopenblas-dev)"
environment = { PKG_CONFIG_PATH = "/usr/lib64/pkgconfig:/usr/lib/pkgconfig" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
