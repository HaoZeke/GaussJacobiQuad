repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: trailing-whitespace
    exclude: ^(src)
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
- repo: https://github.com/pseewald/fprettify
  rev: v0.3.7
  hooks:
  - id: fprettify
    args: ["-c", ".fprettify.rc"]
- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
  - id: isort
    name: isort (python)
    args: ["--profile", "black"]
- repo: https://github.com/psf/black
  rev: 23.3.0
  hooks:
  - id: black
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.0.272
  hooks:
  - id: ruff
    args: ["--fix", "--show-source"]
- repo: local
  hooks:
  - id: insert-license
    name: license header (Fortran)
    entry: python3 scripts/insert_fortran_license.py
    language: system
    files: \.(f90|pyf)$
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
  - id: insert-license
    name: license header (C and Rust)
    files: \.(c|h|rs)$
    args:
      - --license-filepath
      - scripts/license_header.txt
      - --license-filepath
      - scripts/license_header_legacy.txt
      - --comment-style
      - "//"
      - --no-extra-eol
  - id: insert-license
    name: license header (Python)
    files: \.py$
    args:
      - --license-filepath
      - scripts/license_header.txt
      - --license-filepath
      - scripts/license_header_legacy.txt
      - --comment-style
      - "#"
      - --no-extra-eol
