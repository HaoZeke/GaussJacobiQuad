name: Build documentation
on: [push, pull_request]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      - name: Get external tags
        shell: bash -el {0}
        run: |
          set -euo pipefail
          cd apidocs
          mkdir -p tags
          cd tags
          # Best-effort: doxygen still builds without this tag file
          curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
            https://upload.cppreference.com/mwiki/images/f/f8/cppreference-doxygen-web.tag.xml \
            -o cppreference-doxygen-web.tag.xml \
            || echo "warn: cppreference tag download failed; continuing without it"
      - name: Get Theme
        shell: bash -el {0}
        run: |
          cd apidocs
          wget -q https://github.com/HaoZeke/doxyYoda/releases/download/v0.2.2/doxyYoda_0.2.2.tar.gz
          tar xf doxyYoda_0.2.2.tar.gz
      - name: Install official pandoc
        # Conda-forge pandoc has hung on methods.org org tables on GHA; use
        # the upstream amd64 .deb (same major as local/dev).
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb \
            || curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          hash -r
          /usr/bin/pandoc --version | head -1
      - name: Generate Docs
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Prefer the official binary over any conda-shadowed pandoc
          export PATH="/usr/bin:${PATH}"
          hash -r
          echo "==> pandoc=$(command -v pandoc) $($(command -v pandoc) --version | head -1)"
          echo "==> $(date -u +%H:%M:%S) pandoc readme.org"
          pandoc readme.org -t gfm+smart -o README.md
          echo "==> $(date -u +%H:%M:%S) narrative org→html"
          timeout 120 env GJP_DOCS_SKIP_DOXYGEN=1 GJP_DOCS_API_HREF=../index.html \
            PATH="/usr/bin:${PATH}" ./docs/scripts/build_docs.sh
          echo "==> $(date -u +%H:%M:%S) doxygen"
          timeout 180 doxygen apidocs/Doxygen-GaussJacobiQuad.cfg
          echo "==> $(date -u +%H:%M:%S) copy narrative"
          mkdir -p html/narrative
          cp -a docs/site/. html/narrative/
          test -f html/index.html
          test -f html/narrative/index.html
          echo "==> $(date -u +%H:%M:%S) docs OK"
      - name: Archive artifact
        shell: sh
        if: runner.os == 'Linux'
        run: |
          tar \
          --dereference --hard-dereference \
          --exclude=.git \
          --exclude=.github \
          -cvf "$RUNNER_TEMP/artifact.tar" \
          --directory=html .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
  deploy:
    needs: build_docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
