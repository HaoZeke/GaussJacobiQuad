name: Build documentation
on: [push, pull_request]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      - name: Get external tags
        shell: bash -el {0}
        run: |
          set -euo pipefail
          cd apidocs
          mkdir -p tags
          cd tags
          # Best-effort: doxygen still builds without this tag file
          curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
            https://upload.cppreference.com/mwiki/images/f/f8/cppreference-doxygen-web.tag.xml \
            -o cppreference-doxygen-web.tag.xml \
            || echo "warn: cppreference tag download failed; continuing without it"
      - name: Get Theme
        shell: bash -el {0}
        run: |
          cd apidocs
          wget -q https://github.com/HaoZeke/doxyYoda/releases/download/0.0.2/doxyYoda_0.0.2.tar.gz
          tar xf doxyYoda_0.0.2.tar.gz
      - name: Generate Docs
        shell: bash -el {0}
        run: |
          set -euo pipefail
          pandoc readme.org -t gfm+smart -o README.md
          # Single doxygen pass inside build_docs.sh (do not run twice)
          GJP_DOCS_API_HREF=../index.html ./docs/scripts/build_docs.sh
          mkdir -p html/narrative
          cp -a docs/site/. html/narrative/
      - name: Archive artifact
        shell: sh
        if: runner.os == 'Linux'
        run: |
          tar \
          --dereference --hard-dereference \
          --exclude=.git \
          --exclude=.github \
          -cvf "$RUNNER_TEMP/artifact.tar" \
          --directory=html .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
  deploy:
    needs: build_docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
