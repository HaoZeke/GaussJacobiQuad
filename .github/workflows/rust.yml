name: Rust crate
on:
  push:
    paths: ["crates/**", "src/**", "interfaces/CInterface/**", "meson.build", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "src/**", "interfaces/CInterface/**", "meson.build"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        timeout-minutes: 5
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gfortran libopenblas-dev liblapacke-dev meson ninja-build pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C library
        run: |
          meson setup bbdir -Dfcoarray=single -Dwarning_level=1
          meson compile -C bbdir
          echo "GJP_CINTERP=$PWD/bbdir/libgjp_cinterp.so" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/bbdir" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$PWD/bbdir" >> $GITHUB_ENV
      - name: cargo test
        working-directory: crates/gauss-jacobi-quad
        run: cargo test
      - name: cargo package / publish dry-run
        working-directory: crates/gauss-jacobi-quad
        run: |
          cargo package --allow-dirty
          cargo publish --dry-run --allow-dirty
