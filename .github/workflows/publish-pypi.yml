name: Publish to PyPI

on:
  release:
    types: [published]
  # Tag push is the reliable path: GITHUB_TOKEN-created releases do not
  # re-trigger other workflows (so release:published alone is insufficient).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev pkg-config ninja-build
      - name: Build sdist
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev pkg-config ninja-build
          python -m pip install -U build meson-python meson ninja
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.2.1
        # Primary settings in pyproject.toml [tool.cibuildwheel]; env overrides keep CI explicit
        # v3.1+ includes freethreaded 3.14 images when cpython-freethreading is enabled
        env:
          # cp39-abi3 (GIL 3.9+) + free-threaded 3.13t/3.14t; see pyproject.toml
          CIBW_BUILD: "cp39-* cp313t-* cp314t-*"
          CIBW_SKIP: "*-win* *-macos* pp* *musllinux*"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_ARCHS: "auto64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: >
            (yum install -y gcc-gfortran openblas-devel || true);
            (dnf install -y gcc-gfortran openblas-devel || true);
            (apt-get update && apt-get install -y gfortran libopenblas-dev || true)
          CIBW_ENVIRONMENT: "PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/lib/pkgconfig"
          CIBW_BUILD_FRONTEND: "build"
          CIBW_TEST_REQUIRES: "pytest numpy"
          CIBW_TEST_COMMAND: "pytest {project}/python/tests -q"

        with:
          output-dir: wheelhouse
          package-dir: .
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl

  publish:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_pypi) && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_pypi) && 'https://test.pypi.org/p/gauss-jacobi-quad' || 'https://pypi.org/p/gauss-jacobi-quad' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Flatten dist
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;
          ls -la upload/
      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
      - name: Publish to PyPI
        if: >-
          github.event_name == 'release' ||
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && !inputs.test_pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
