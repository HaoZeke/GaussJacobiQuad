name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel (pure Python ctypes)
        working-directory: python
        run: |
          python -m pip install -U build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.test_pypi && 'testpypi' || 'pypi' }}
      url: ${{ inputs.test_pypi && 'https://test.pypi.org/p/gauss-jacobi-quad' || 'https://pypi.org/p/gauss-jacobi-quad' }}
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.test_pypi) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
