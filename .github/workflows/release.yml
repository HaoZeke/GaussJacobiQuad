name: Release

# Creates a GitHub Release when a semver tag (vX.Y.Z or vX.Y.Z-pre) is pushed. Tags are
# produced locally by `cog bump` (see docs/release.md); this workflow does not
# choose versions. Zenodo watches the GitHub Release for DOI minting.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z or vX.Y.Z-pre tag to publish (required for workflow_dispatch)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$TAG_INPUT" ]; then
              echo "error: workflow_dispatch requires inputs.tag (vX.Y.Z or vX.Y.Z-pre); refusing to publish GITHUB_REF_NAME" >&2
              exit 1
            fi
            TAG="$TAG_INPUT"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "error: release tag is empty" >&2
            exit 1
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: tag must be semver vX.Y.Z or vX.Y.Z-pre, got: $TAG" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "error: tag $TAG does not exist in this checkout" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "error: release tag is empty" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "error: tag $TAG does not exist in this checkout" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          # Prefer NEWS.md section for this version when present; else GH notes.
          NOTES_ARGS=(--generate-notes)
          VER="${TAG#v}"
          # Headings are "# 0.2.6 (date)" or, for 0.1.0, an unhashed "0.1.0 (date)".
          # Escape metacharacters so a dot is not "any character", and anchor the
          # token between the heading start and the following space (1.0.0 must
          # not match 1x0x0 or 1.0.0-rc1).
          VER_RE=$(printf '%s\n' "$VER" | sed 's/[.[\\*^$()+?{|]/\\&/g')
          if [ -f NEWS.md ] && grep -Eq "^#? ?${VER_RE} " NEWS.md 2>/dev/null; then
            # Extract this version until the next version heading or EOF.
            awk -v ver="$VER_RE" '
              $0 ~ "^#? ?" ver " " {grab=1; print; next}
              grab && $0 ~ "^#? ?[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)? " {exit}
              grab {print}
            ' NEWS.md > /tmp/release-notes.md
            if [ -s /tmp/release-notes.md ]; then
              NOTES_ARGS=(--notes-file /tmp/release-notes.md)
            fi
          fi
          REL_ARGS=()
          # vX.Y.Z-pre is a GitHub prerelease. Plain vX.Y.Z stays a normal release.
          if printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            REL_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            "${REL_ARGS[@]}" \
            "${NOTES_ARGS[@]}"
