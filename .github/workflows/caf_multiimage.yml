name: CAF multi-image (MPICH + OpenCoarrays)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "test/**"
      - "fpm.toml"
      - "docker/caf/**"
      - ".github/workflows/caf_multiimage.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "test/**"
      - "fpm.toml"
      - "docker/caf/**"
      - ".github/workflows/caf_multiimage.yml"
  workflow_dispatch:

concurrency:
  group: caf-multiimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the pure-Nix OCI recipe (validates docker/caf flake).
  oci-image:
    name: nix build docker/caf#oci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build OpenCoarrays + OCI image
        run: |
          nix build ./docker/caf#opencoarrays -L --print-build-logs
          nix build ./docker/caf#oci -L --print-build-logs -o gjp-caf-oci
          ls -la gjp-caf-oci
      - name: Load image into Docker (smoke)
        run: |
          set -euo pipefail
          docker load < gjp-caf-oci
          docker images
          # image name comes from dockerTools config
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | head -1)
          docker run --rm "$IMG" bash -lc 'gfortran --version | head -1; cafrun -h 2>&1 | head -3 || true; fpm --version | head -3'

  # Multi-image tests via nix shell (same toolchain as the image contents).
  multiimage-tests:
    name: cafrun multi-image tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Probe num_images() ≥ 2
        run: |
          nix build ./docker/caf#checks.x86_64-linux.opencoarrays-probe -L --print-build-logs
          cat result
      - name: Build and test with multi-image CAF
        run: |
          nix develop ./docker/caf -c bash docker/caf/ci-entrypoint.sh

  # Optional: push image when docker recipe changes on main.
  publish-ghcr:
    name: publish ghcr.io CAF image
    needs: [oci-image, multiimage-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and push OCI
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/gaussjacobiquad-caf
        run: |
          nix build ./docker/caf#oci -o gjp-caf-oci
          docker load < gjp-caf-oci
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # Tag whatever name dockerTools assigned
          SRC=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i gaussjacobiquad-caf | head -1)
          docker tag "$SRC" "$REGISTRY/$IMAGE_NAME:latest"
          docker tag "$SRC" "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::7}"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::7}"
