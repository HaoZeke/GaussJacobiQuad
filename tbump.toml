# DEPRECATED — do not use tbump on this repository.
#
# Release engineering moved to cocogitto (`cog`). See:
#   - cog.toml          (semver, hooks, commit types)
#   - towncrier.toml    (NEWS.md / newsfragments/)
#   - scripts/set_version.sh
#   - docs/release.md   (how to cut a release)
#
# Historical note: this file previously listed fpm.toml, meson.build, and the
# Doxygen config as versioned files and ran towncrier + add_headers.py before
# a REL: commit. Those steps are now pre_bump_hooks in cog.toml.

[version]
current = "0.2.6"

# Example of a semver regexp.
# Make sure this matches current_version before
# using tbump
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[git]
message_template = "REL: Bump to v{new_version}"
tag_template = "v{new_version}"

# For each file to patch, add a [[file]] config
# section containing the path of the file, relative to the
# tbump.toml location.
[[file]]
src = "apidocs/Doxygen-GaussJacobiQuad.cfg"
[[file]]
src = "fpm.toml"
[[file]]
src = "meson.build"

# You can specify a list of commands to
# run after the files have been patched
# and before the git commit is made

[[before_commit]]
name = 'update fortran license headers'
cmd = "python scripts/add_headers.py --dirs src/ interfaces/ --ftypes 'f90,f77' --cchar '!'"
[[before_commit]]
name = 'update C license headers'
cmd = "python scripts/add_headers.py --dirs interfaces --ftypes 'c,h' --cchar '//'"
[[before_commit]]
name = 'update Python license headers'
cmd = "python scripts/add_headers.py --dirs interfaces scripts --ftypes 'py' --cchar '#'"
[[before_commit]]
name = 'generate news'
cmd = "towncrier build --version $(tbump current-version)"

#  [[before_commit]]
#  name = "check changelog"
#  cmd = "grep -q {new_version} Changelog.rst"

