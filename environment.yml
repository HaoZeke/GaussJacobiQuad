# To use:
#
#   $ mamba env create -f environment.yml
#   $ mamba activate rgpotpy
#
name: gaussjacquad
channels:
  - conda-forge
dependencies:
  - compilers
  - meson
  - meson-python
  - ninja
  - gfortran
  - pkg-config
  - openblas
  - liblapacke
  # meson requires -llapacke. OpenBLAS symbols are not enough after f6cbbcc.
  - fpm
  - fprettify
  # Pin GIL CPython (not freethreaded 3.14t) for Limited API / abi3 package builds
  - python=3.12
  # Python, Sympy
  - ipython
  - sympy
  - numpy
  - jupytext
  - papermill
  - ipykernel
  - pip
  # More testing
  - pytest
  # Headers
  - jinja2
  # Documentation
  - pandoc
  - doxygen>=1.17 # doxyYoda 0.2 templates
  - graphviz # for dot
  # Release management
  - towncrier
  - tbump
