# Customized Options
# Make changes here to prevent things from being overwritten when the main file
# is updated
# Defaults
@INCLUDE                = "apidocs/Doxyfile.cfg"

# XML
GENERATE_XML            = NO
XML_PROGRAMLISTING      = NO

# HTML
GENERATE_HTML           = YES

# LaTeX
GENERATE_LATEX          = NO

# Project Settings
PROJECT_NAME            = "GaussJacobiQuad"
PROJECT_NUMBER         = 0.2.6
PROJECT_BRIEF           = "A library for fast and accurate computation of Gauss-Jacobi quadrature nodes and weights written in modern Fortran with bindings to Python and C"
# PROJECT_LOGO            = "images/Logo.png"
# IMAGE_PATH             = "./images"

# Apidocs Settings
RECURSIVE              = YES
EXTRACT_ALL            = YES
# Restrict to library sources (scanning the whole tree is slow and brittle)
INPUT                  = README.md src app interfaces/CInterface python/src
EXCLUDE                = build bbdir html docker
EXCLUDE_PATTERNS       = */bbdir/* */.git/* */html/* */docker/* */__pycache__/*
USE_MDFILE_AS_MAINPAGE = README.md
# Leave empty: real .bib requires bibtex (not in the conda docs env) and
# doxygen 1.9.1 can stall waiting for it. Narrative citation lives in docs/refs.bib.
CITE_BIB_FILES         =

# Language additions
OPTIMIZE_FOR_FORTRAN = YES

# XML
GENERATE_XML            = NO
XML_PROGRAMLISTING      = NO
# LaTeX
GENERATE_LATEX          = NO

# Style
JAVADOC_BANNER         = YES
JAVADOC_AUTOBRIEF      = NO
INHERIT_DOCS           = YES
INLINE_SOURCES         = YES
SOURCE_BROWSER         = YES
DISABLE_INDEX          = NO
GENERATE_TREEVIEW      = NO
# Graphviz off in CI: doxygen 1.9.1 + interactive SVG has stalled GHA jobs;
# re-enable locally if you have a current doxygen+dot stack.
HAVE_DOT               = NO
DOT_IMAGE_FORMAT       = png
HTML_DYNAMIC_SECTIONS  = YES
INTERACTIVE_SVG        = NO
# Theme
# HTML
GENERATE_HTML          = YES
USE_MATHJAX            = YES
HTML_HEADER            = "apidocs/doxyYoda/html/header.html"
HTML_FOOTER            = "apidocs/doxyYoda/html/footer.html"
HTML_EXTRA_STYLESHEET  = "apidocs/doxyYoda/css/doxyYoda.min.css"
LAYOUT_FILE            = "apidocs/doxyYoda/xml/doxyYoda.xml"

# Extract everything
# EXTRACT_ALL            = NO
EXTRACT_PRIVATE        = YES
EXTRACT_PRIV_VIRTUAL   = YES
EXTRACT_PACKAGE        = YES
EXTRACT_STATIC         = YES
MACRO_EXPANSION        = YES
ENABLE_PREPROCESSING   = YES

# Local Variables:
# mode: conf
# End:
