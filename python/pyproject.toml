# Packaging is configured at the repository root (pyproject.toml + meson.build
# with -Dpython_package=true) so sdist includes Fortran sources and git metadata.
# From repo root:
#   pip install .
#   python -m build
#   uv build
#
# This file remains for discoverability; prefer the root pyproject.toml.
[project]
name = "gauss-jacobi-quad"
dynamic = ["version"]
