name = "GaussJacobiQuad"
version = "0.2.4"
license = "MIT"
author = "Rohit Goswami"
maintainer = "rog32@hi.is"
copyright = "Copyright 2023--present, featom developers"
# Coarray Fortran: recurrence method "rec_caf" uses this_image/num_images/coarrays.
# Build with gfortran CAF support, e.g.:
#   fpm build --flag "-fcoarray=single"
#   fpm test  --flag "-fcoarray=single"
# Multi-image via OpenCoarrays (libcaf_mpi). Prefer MPICH with gfortran ≥14/15
# (OpenMPI is rejected by OpenCoarrays for that toolchain). Timed driver:
#   fpm build --flag "-fcoarray=lib" \
#     --link-flag "-L$OC/lib -lcaf_mpi -L$MPICH/lib -lmpifort -lmpi"
#   cafrun -n 4 ./build/*/app/gjp_bench_caf 6144 0.5 0.5 7 3
# Confirmed on rg.terra: npts=6144, 1→4 images ≈1.94× on rec_caf compute.
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["openblas"]
[install]
library = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
